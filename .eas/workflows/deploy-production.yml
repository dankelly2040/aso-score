name: Deploy to production

# Triggered on every push to main once the Expo GitHub App is installed for
# this project. See: https://docs.expo.dev/eas/workflows/get-started/

on:
  push:
    branches: ['main']

jobs:
  deploy:
    name: Deploy web bundle to EAS Hosting
    # Selecting the "production" EAS environment makes ANTHROPIC_API_KEY (and
    # any other sensitive vars) available to the deploy job AND injects them
    # into the deployed Cloudflare Worker runtime for the /api routes.
    environment: production
    steps:
      - uses: eas/checkout
      - name: Install pnpm
        run: npm install -g pnpm@10.33.1
      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile
      - name: Export web bundle
        run: pnpm --filter aso-score exec expo export -p web
      - name: Deploy to production
        working-directory: apps/web
        run: npx eas-cli@latest deploy --prod --non-interactive
